spring.application.name=core-banking-management-system
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/corebank_lite
spring.datasource.username=corebank_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=30
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.document.storage-path=D:/cbms-private-documents
logging.level.org.springframework.security.oauth2=INFO
logging.level.org.springframework.security.web.authentication=INFO

# Console and CBMS Application Logs both use the same rolling Logback file.
app.logs.path=${APP_LOG_PATH:logs/cbms.log}
# Keep SQLSTATE/constraint identifiers in restricted server logs by default.
app.errors.expose-database-diagnostics=false


# Phase 14 — bounded resource use (override with environment variables per deployment).
# Pool size must be calculated against PostgreSQL max_connections and all app replicas.
spring.datasource.hikari.maximum-pool-size=${CBMS_DB_POOL_MAX:12}
spring.datasource.hikari.minimum-idle=${CBMS_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${CBMS_DB_POOL_WAIT_MS:10000}
spring.datasource.hikari.validation-timeout=${CBMS_DB_VALIDATION_MS:5000}
spring.datasource.hikari.idle-timeout=${CBMS_DB_IDLE_MS:600000}
spring.datasource.hikari.max-lifetime=${CBMS_DB_MAX_LIFETIME_MS:1800000}
# PostgreSQL JDBC connect timeout is in seconds; separate from Hikari pool wait.
spring.datasource.hikari.data-source-properties.connectTimeout=${CBMS_PG_CONNECT_TIMEOUT_SECONDS:5}

# Protect the HTTP worker pool and drain in-flight requests during a graceful shutdown.
server.tomcat.threads.max=${CBMS_HTTP_MAX_THREADS:100}
server.tomcat.accept-count=${CBMS_HTTP_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${CBMS_HTTP_CONNECTION_TIMEOUT:10s}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${CBMS_SHUTDOWN_GRACE:30s}
# Do not trust client-supplied X-Forwarded-* headers unless a vetted proxy is configured.
server.forward-headers-strategy=${CBMS_FORWARDED_HEADERS_STRATEGY:none}
# Safe, low-cardinality slow-request log; 0 disables, no URL or customer data is logged.
app.performance.slow-request-ms=${CBMS_SLOW_REQUEST_MS:2000}
